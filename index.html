<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A warm and elegant 3D Harper's art gallery built with Three.js."
    />
    <title>Harper's 3D Art Gallery</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud">WASD or Arrow Keys: Move | Mouse Drag: Look Around | Click Artwork: Details</div>
      <button id="fullscreen-toggle" type="button" aria-label="Toggle full screen">Full Screen</button>
      <div id="overlay" class="hidden" aria-live="polite" role="dialog" aria-label="Artwork details">
        <button id="overlay-close" type="button" aria-label="Close artwork details">Close</button>
        <img id="overlay-image" src="" alt="" />
        <h2 id="overlay-title">Artwork Title</h2>
        <p id="overlay-year">2026</p>
        <p id="overlay-description">Artwork description.</p>
      </div>
      <div id="joystick" aria-label="Touch joystick control">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
