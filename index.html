<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A warm and elegant 3D private art gallery built with Three.js."
    />
    <title>Private 3D Art Gallery</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud">Drag to look around | Scroll to zoom | Click artwork for details</div>
      <div id="overlay" class="hidden" aria-live="polite" role="dialog" aria-label="Artwork details">
        <button id="overlay-close" type="button" aria-label="Close artwork details">Close</button>
        <img id="overlay-image" src="" alt="" />
        <h2 id="overlay-title">Artwork Title</h2>
        <p id="overlay-year">2026</p>
        <p id="overlay-description">Artwork description.</p>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
