<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A warm and elegant 3D Harper's art gallery built with Three.js."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harper's Gallery" />
    <meta property="og:description" content="A warm and elegant 3D Harper's art gallery built with Three.js." />
    <meta property="og:image" content="./cover.png" />
    <meta property="og:image:alt" content="Social preview cover for Harper's Gallery." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harper's Gallery" />
    <meta name="twitter:description" content="A warm and elegant 3D Harper's art gallery built with Three.js." />
    <meta name="twitter:image" content="./cover.png" />
    <title>Harper's Gallery</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="top-controls">
        <button id="fullscreen-toggle" type="button" aria-label="Enter full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4" />
          </svg>
        </button>
        <button id="help-toggle" type="button" aria-label="Open help">?</button>
      </div>
      <div id="overlay" class="hidden" aria-live="polite" role="dialog" aria-label="Artwork details">
        <button id="overlay-close" type="button" aria-label="Close artwork details">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6l-12 12" />
          </svg>
        </button>
        <img id="overlay-image" src="" alt="" />
        <h2 id="overlay-title">Artwork Title</h2>
        <p id="overlay-year">2026</p>
        <p id="overlay-description">Artwork description.</p>
      </div>
      <div
        id="help-overlay"
        class="hidden"
        aria-live="polite"
        role="dialog"
        aria-modal="true"
        aria-labelledby="help-title"
      >
        <section id="help-card">
          <button id="help-close" type="button" aria-label="Close help">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6l-12 12" />
            </svg>
          </button>
          <p id="help-kicker">導覽 Guide</p>
          <h2 id="help-title">歡迎來到 Harper 畫廊<br>Welcome to Harper's Gallery</h2>
          <p id="help-subtitle">用以下方式探索作品 Explore the gallery with these controls</p>
          <ul id="help-list">
            <li>
              <span class="help-label">移動 Move</span>
              <span id="help-move-detail" class="help-detail">方向鍵 Arrow Keys / WASD</span>
            </li>
            <li>
              <span class="help-label">環視 Look Around</span>
              <span id="help-look-detail" class="help-detail">按住滑鼠拖動 Mouse Drag</span>
            </li>
            <li>
              <span class="help-label">查看作品 View Artwork</span>
              <span id="help-click-detail" class="help-detail">點擊查看作品 Click Artwork</span>
            </li>
          </ul>
          <button id="help-start" type="button">開始探索 Start Exploring</button>
        </section>
      </div>
      <div id="joystick" aria-label="Touch joystick control">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
